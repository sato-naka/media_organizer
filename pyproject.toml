[tool.poetry]
name = "たくさん画像移動整理君"
version = "0.1.0"
authors = ["sato-naka <sato.naka774@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
pyinstaller = "^6.20.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pyinstaller (>=6.20.0,<7.0.0)"
]
