[tool.poetry]
name = "media-organizer"
version = "0.1.0"
description = "特定のフォルダから特定のフォルダへ年月で階層分けしながら画像や動画を仕分けるスクリプト"
authors = ["sato-naka <sato.naka774@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
pyinstaller = "^6.20.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"